name: Production CI & Deployment Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend CI & Quantum Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Complete Test Suite (23 Tests)
        run: |
          cd backend
          python test_suite.py

      - name: Verify FastAPI Startup & Health Probe
        run: |
          cd backend
          python -c "from fastapi.testclient import TestClient; from main import app; c = TestClient(app); r = c.get('/health'); assert r.status_code == 200; print('HEALTH CHECK PASSED:', r.json())"
